services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: matches
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - matches_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matches -d matches"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    environment:
      DB_URL: jdbc:postgresql://database:5432/matches
      DB_USERNAME: admin
      DB_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy

volumes:
  matches_data:

