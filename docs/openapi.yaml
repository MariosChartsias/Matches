openapi: 3.1.0
info:
  title: Matches API
  version: 1.0.0
  description: REST API for managing sports matches and their odds.
  license:
    name: Unlicensed
servers:
  - url: /
    description: Server hosting the API
tags:
  - name: Authentication
    description: Obtain access tokens
  - name: Matches
    description: Match management operations
  - name: Match odds
    description: Operations for odds belonging to a match
security:
  - bearerAuth: []

paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: Get a JWT access token
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/matches:
    get:
      tags: [Matches]
      summary: List all matches
      operationId: listMatches
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: A page of matches; the default order is date, time, then id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Matches]
      summary: Create a match
      operationId: createMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "201":
          description: Match created
          headers:
            Location:
              description: URI of the created match
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/matches/{matchId}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags: [Matches]
      summary: Get a match
      operationId: getMatch
      responses:
        "200":
          description: Match found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Matches]
      summary: Replace a match's details
      operationId: updateMatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchRequest"
      responses:
        "200":
          description: Match updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Matches]
      summary: Delete a match
      description: The match's odds are deleted with it.
      operationId: deleteMatch
      responses:
        "204":
          description: Match deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/matches/{matchId}/odds:
    parameters:
      - $ref: "#/components/parameters/MatchId"
    get:
      tags: [Match odds]
      summary: List a match's odds
      operationId: listMatchOdds
      responses:
        "200":
          description: Odds ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MatchOddResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Match odds]
      summary: Add an odd to a match
      operationId: createMatchOdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchOddRequest"
      responses:
        "201":
          description: Odd created
          headers:
            Location:
              description: URI of the created odd
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchOddResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/matches/{matchId}/odds/{oddId}:
    parameters:
      - $ref: "#/components/parameters/MatchId"
      - $ref: "#/components/parameters/OddId"
    get:
      tags: [Match odds]
      summary: Get one odd
      operationId: getMatchOdd
      responses:
        "200":
          description: Odd found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchOddResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Match odds]
      summary: Replace an odd
      operationId: updateMatchOdd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchOddRequest"
      responses:
        "200":
          description: Odd updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchOddResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Match odds]
      summary: Delete an odd
      operationId: deleteMatchOdd
      responses:
        "204":
          description: Odd deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page number
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Number of matches per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: Sort as property,direction; may be repeated
      schema:
        type: array
        items:
          type: string
        default: ["matchDate,asc", "matchTime,asc", "id,asc"]
      style: form
      explode: true
    MatchId:
      name: matchId
      in: path
      required: true
      description: Match identifier
      schema:
        type: integer
        format: int64
        minimum: 1
    OddId:
      name: oddId
      in: path
      required: true
      description: Odd identifier
      schema:
        type: integer
        format: int64
        minimum: 1

  responses:
    Unauthorized:
      description: Missing, expired, or invalid JWT
    BadRequest:
      description: Invalid request body
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: Request conflicts with existing data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"

  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: admin
        password:
          type: string
          format: password
          example: admin

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresInSeconds]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresInSeconds:
          type: integer
          example: 3600

    Sport:
      type: string
      enum: [FOOTBALL, BASKETBALL]

    MatchRequest:
      type: object
      required:
        - description
        - matchDate
        - matchTime
        - teamA
        - teamB
        - sport
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 200
          example: OSFP - PAO
        matchDate:
          type: string
          format: date
          example: 2026-09-10
        matchTime:
          type: string
          description: ISO-8601 local time with no timezone
          pattern: "^(?:[01][0-9]|2[0-3]):[0-5][0-9](?::[0-5][0-9](?:\\.[0-9]{1,9})?)?$"
          example: "20:30:00"
        teamA:
          type: string
          minLength: 1
          maxLength: 100
          example: OSFP
        teamB:
          type: string
          minLength: 1
          maxLength: 100
          example: PAO
        sport:
          $ref: "#/components/schemas/Sport"

    MatchOddRequest:
      type: object
      required: [specifier, odd]
      properties:
        specifier:
          type: string
          minLength: 1
          maxLength: 50
          example: X
        odd:
          type: number
          format: double
          exclusiveMinimum: 0
          maximum: 9999999.999
          multipleOf: 0.001
          example: 1.5

    MatchResponse:
      allOf:
        - $ref: "#/components/schemas/MatchRequest"
        - type: object
          required: [id, odds]
          properties:
            id:
              type: integer
              format: int64
              example: 1
            odds:
              type: array
              items:
                $ref: "#/components/schemas/MatchOddResponse"

    MatchPage:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/MatchResponse"
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
        totalElements:
          type: integer
          format: int64
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    MatchOddResponse:
      allOf:
        - $ref: "#/components/schemas/MatchOddRequest"
        - type: object
          required: [id, matchId]
          properties:
            id:
              type: integer
              format: int64
              example: 1
            matchId:
              type: integer
              format: int64
              example: 1

    ApiError:
      type: object
      required:
        - timestamp
        - status
        - error
        - message
        - path
        - validationErrors
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        error:
          type: string
          example: Bad Request
        message:
          type: string
          example: Request validation failed
        path:
          type: string
          example: /api/v1/matches
        validationErrors:
          type: object
          additionalProperties:
            type: string
          example:
            description: must not be blank

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
