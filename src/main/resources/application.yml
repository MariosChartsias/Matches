spring:
  application:
    name: matches-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/matches}
    username: ${DB_USERNAME:matches}
    password: ${DB_PASSWORD:matches}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

